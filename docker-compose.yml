version: '3.8'

services:

  tailscale:
    build:
      context: .
    user: root
    ports:
      -  "1056:1056"
    environment:
      - PORT=${PORT}
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true

      - TS_EPHEMERAL=true
      - TS_HOSTNAME=railway-proxy
    command: tailscaled --tun=userspace-networking --outbound-http-proxy-listen=0.0.0.0:1056
    volumes:
      - tailscale_data:/var/lib/tailscale
    restart: unless-stopped
    
volumes: 
  tailscale_data:
