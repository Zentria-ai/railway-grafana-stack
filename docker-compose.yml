version: '3.8'
services:
  tailscale:
    build:
      context: .
    user: root
    ports:
      - "1055:1055"
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_EPHEMERAL=true
      - TS_HOSTNAME=railway-proxy
    volumes:
      - tailscale_data:/var/lib/tailscale
    restart: unless-stopped
