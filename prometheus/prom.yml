global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'external-api-prod'
    scheme: http
    static_configs:
      - targets: ['external-api-production-3af3.up.railway.app:80']
        labels:
          env: 'prod'

  - job_name: 'n8n-prod'
    scheme: http
    static_configs:
      - targets: ['primary-production-cfef6.up.railway.app:80']
        labels:
          env: 'prod'

  - job_name: 'analytics-api-prod'
    scheme: http
    static_configs:
      - targets: ['analytics-api-production-1326.up.railway.app:80']
        labels:
          env: 'prod'
  
