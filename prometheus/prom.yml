global:
  scrape_interval: 10s # Intervalo de captura de métricas
  evaluation_interval: 10s # Intervalo para evaluar reglas de alerta

scrape_configs:
  # --- PROMETHEUS (Auto-monitoreo) ---
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # --- EXTERNAL API ---
  - job_name: 'external-api'
    scheme: http
    static_configs:
      - targets: ['external-api-production-3af3.up.railway.app']
        labels:
          env: 'production'
      - targets: ['100.117.194.110:8000']
        labels:
          env: 'development'
    relabel_configs:
      - source_labels: [env]
        regex: '^development$'
        target_label: __proxy_url__
        replacement: 'http://127.0.0.1:1055'

  # --- N8N ---
  - job_name: 'n8n'
    scheme: http
    static_configs:
      - targets: ['primary-production-cfef6.up.railway.app']
        labels:
          env: 'production'
      - targets: ['100.117.194.110:5678']
        labels:
          env: 'development'
    relabel_configs:
      - source_labels: [env]
        regex: '^development$'
        target_label: __proxy_url__
        replacement: 'http://127.0.0.1:1055'

  # --- ANALYTICS API ---
  - job_name: 'analytics-api'
    scheme: http
    static_configs:
      - targets: ['analytics-api-production-1326.up.railway.app']
        labels:
          env: 'production'
      - targets: ['100.117.194.110:2222']
        labels:
          env: 'development'
    relabel_configs:
      - source_labels: [env]
        regex: '^development$'
        target_label: __proxy_url__
        replacement: 'http://127.0.0.1:1055'
  
