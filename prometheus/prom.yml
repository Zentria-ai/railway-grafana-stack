global:
  scrape_interval: 15s # Default scrape interval

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'external_api'
    scheme: http
    static_configs:
      - targets: ['external-api-production-3af3.up.railway.app']

  - job_name: 'n8n'
    scheme: http
    static_configs:
      - targets: ['primary-production-cfef6.up.railway.app']

  - job_name: 'n8n'
    scheme: http
    static_configs:
      - targets: ['analytics-api.railway.internal']
  
